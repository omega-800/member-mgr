[package]
name = "member-mgr"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tiny_http = "0.12.0"
serde_urlencoded = "0.7.1"
altcha = { version = "0.2.0", optional = true }
rand = { version = "0.10.3", optional = true }
base64 = { version =  "0.23.1", optional = true }
serde_json = { version = "1.0.151", optional = true }
serde = { version = "1.0.229", optional = true }
lettre = { version = "0.11.23", default-features = false, optional = true, features = [
    "builder",
    "smtp-transport",
    "rustls-tls",
] }
dotenvy = { version = "0.15", optional = true }

[features]
default = ["altcha", "mail"]
altcha = ["dep:altcha", "dep:rand", "dep:serde", "dep:serde_json", "dep:base64"]
mail = ["dep:lettre"]
dotenvy = ["dep:dotenvy"]
